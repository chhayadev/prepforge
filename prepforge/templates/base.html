<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}PrepForge{% endblock %} | PrepForge</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
      :root {
        --bg: #0f1220;
        --card: #181c2e;
        --bd: #2a3050;
        --tx: #eceefb;
        --mu: #98a0bd;
        --ac: #8b86ff;
        --btn: #6d5efc;
        --ac2: #23274a;
      }
      body { background: var(--bg); color: var(--tx); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .navbar { background: var(--card); border-bottom: 1px solid var(--bd); }
      .brand { color: var(--ac) !important; font-weight: 800; font-size: 1.25rem; }
      .text-secondary, .text-muted { color: var(--mu) !important; }

      .pf-btn { background: var(--btn); color: #fff; border: 1px solid var(--btn); border-radius: 8px; }
      .pf-btn:hover { background: #5b4ae6; color: #fff; }
      .pf-btn-outline { background: transparent; color: var(--tx); border: 1px solid var(--bd); border-radius: 8px; }
      .pf-btn-outline:hover { border-color: var(--ac); color: var(--ac); }

      .pf-card { background: var(--card); border: 1px solid var(--bd); border-radius: 14px; padding: 20px; height: 100%; }
      .hero { background: linear-gradient(120deg, #1d1b4b, #6d5efc); color: #fff; border-radius: 24px; padding: 60px 35px; }
      .tag { display: inline-block; background: var(--ac2); color: var(--ac); border-radius: 99px; padding: 3px 12px; font-size: 13px; }
      .big { font-size: 2.2rem; font-weight: 800; }
      .bar { height: 8px; background: var(--ac2); border-radius: 6px; overflow: hidden; margin-top: 8px; }
      .bar > i { display: block; height: 100%; background: var(--ac); }

      /* Django forms (register / login) */
      .form-box { max-width: 480px; margin: 0 auto; }
      .form-box p { margin-bottom: 14px; }
      .form-box label { display: block; margin-bottom: 4px; color: var(--mu); font-size: 14px; }
      .form-box input, .form-box select {
        width: 100%; background: var(--bg); color: var(--tx);
        border: 1px solid var(--bd); border-radius: 8px; padding: 9px 12px;
      }
      .form-box input:focus, .form-box select:focus { outline: none; border-color: var(--ac); }
      .form-box .helptext { display: block; color: var(--mu); font-size: 12px; margin-top: 4px; }
      .form-box ul { padding-left: 18px; }
      .errorlist { color: #f87171; list-style: none; padding: 0 !important; font-size: 13px; margin: 4px 0; }
    </style>
  </head>

  <body>
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand brand" href="/">⚒ PrepForge</a>

        <div class="ms-auto d-flex gap-2 align-items-center">
          {% if user.is_authenticated and not user.is_staff %}
            <a href="{% url 'dashboard' %}" class="btn pf-btn-outline btn-sm">Dashboard</a>
            <a href="{% url 'assessments' %}" class="btn pf-btn-outline btn-sm">Assessments</a>
            <form method="post" action="{% url 'logout' %}" class="m-0">
              {% csrf_token %}
              <button type="submit" class="btn pf-btn btn-sm">Logout</button>
            </form>
          {% else %}
            <!-- <a href="{% url 'login' %}" class="btn pf-btn-outline btn-sm"> Login</a>
            <a href="{% url 'register' %}" class="btn pf-btn-outline btn-sm"> Register</a> -->

            
<div class="dropdown">
    <button
        class="btn pf-btn-outline btn-sm dropdown-toggle"
        type="button"
        id="studentPortalDropdown"
        data-bs-toggle="dropdown"
        aria-expanded="false">
        Student Portal
    </button>

    <ul class="dropdown-menu dropdown-menu-end"
        aria-labelledby="studentPortalDropdown">

        <li>
            <a class="dropdown-item pf-btn-outline " href="{% url 'login' %}">
                Student Login
            </a>
        </li>

        <li>
            <a class="dropdown-item pf-btn-outline" href="{% url 'register' %}">
                Student Register
            </a>
        </li>

    </ul>
</div>

            <a href="/admin/" class="btn pf-btn-outline btn-sm">Admin</a>
          {% endif %}
        </div>
      </div>
    </nav>

    <main class="container py-5">
      {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-secondary pb-4">
      PrepForge — Student Placement Readiness and Tracking System
    </footer>
  </body>
</html>
