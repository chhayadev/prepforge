{% extends 'base.html' %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="form-box pf-card">
  <h3 class="mb-3">Student Registration</h3>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn pf-btn w-100">Register</button>
  </form>
  <p class="text-secondary mt-3 mb-0">Already registered? <a href="{% url 'login' %}">Login</a></p>
</div>
{% endblock %}
