{% extends 'base.html' %}
{% block title %}Test{% endblock %}

{% block content %}
<h3 class="mb-4 text-capitalize">{{ category }} Test</h3>
<form method="post">
  {% csrf_token %}
  {% for q in questions %}
    <div class="pf-card mb-3">
      <p class="fw-bold mb-3">{{ forloop.counter }}. {{ q.text }}</p>
      <div class="form-check mb-1"><input class="form-check-input" type="radio" name="q{{ q.id }}" value="a" id="q{{ q.id }}a" required><label class="form-check-label" for="q{{ q.id }}a">{{ q.option_a }}</label></div>
      <div class="form-check mb-1"><input class="form-check-input" type="radio" name="q{{ q.id }}" value="b" id="q{{ q.id }}b"><label class="form-check-label" for="q{{ q.id }}b">{{ q.option_b }}</label></div>
      <div class="form-check mb-1"><input class="form-check-input" type="radio" name="q{{ q.id }}" value="c" id="q{{ q.id }}c"><label class="form-check-label" for="q{{ q.id }}c">{{ q.option_c }}</label></div>
      <div class="form-check"><input class="form-check-input" type="radio" name="q{{ q.id }}" value="d" id="q{{ q.id }}d"><label class="form-check-label" for="q{{ q.id }}d">{{ q.option_d }}</label></div>
    </div>
  {% empty %}
    <p class="text-secondary">No questions available.</p>
  {% endfor %}
  {% if questions %}
    <button type="submit" class="btn pf-btn">Submit test</button>
  {% endif %}
</form>
{% endblock %}
